plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.16.0'
}

group = 'org.jf'
version = '0.6.10'

def pythonCoreVersion = "261.24374.151"

repositories {
    mavenCentral()
    gradlePluginPortal()

     intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    testImplementation 'junit:junit:4.12'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.athaydes.rawhttp:rawhttp-core:2.2.1'

    intellijPlatform {
        intellijIdea("2026.1.2")
        bundledPlugin("com.intellij.java")
        plugin("PythonCore:$pythonCoreVersion")
    }
}

intellijPlatform {
    pluginConfiguration {
        id = "org.jf.fusionIdea"
        name = "Fusion 360 Scripting"
        version = "0.6.10"

        ideaVersion {
            sinceBuild = "261"
        }
    }
}

tasks.named("prepareSandbox") {
    from("src/main/python") {
        into("${project.name}/lib")
    }
}